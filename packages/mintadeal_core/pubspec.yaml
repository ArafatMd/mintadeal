name: mintadeal_core
description: Shared API client, models, sign-in and UI kit for the Mintadeal apps.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^8.3.2
  flutter_riverpod: ^3.4.3
  geolocator: ^14.1.1
  http: ^1.6.0
  image_picker: ^1.2.4
  intl: ^0.20.2
  latlong2: ^0.10.1
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/logo.png
