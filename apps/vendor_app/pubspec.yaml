publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  mintadeal_core: any
  image_picker: ^1.2.4
  intl: ^0.20.2
