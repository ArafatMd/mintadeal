<!DOCTYPE html>
<html lang="en-IN">
<head>
  <!-- Replaced by the value of `flutter build --base-href`. -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Deals from shops and pop-up stalls near you in Bengaluru. Order, pick up or get it delivered.">
  <meta name="theme-color" content="#FFF8F0">

  <!-- Installable app: Android and desktop read manifest.json; iPhone and iPad read these. -->
  <link rel="manifest" href="manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Mintadeal">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="favicon.png">

  <title>Mintadeal</title>

  <script>
    // Lets the app offer "Install" itself. Chrome and Edge on Android and computers announce that the app can be
    // installed with `beforeinstallprompt`; iPhone and iPad have no such event, so the app shows the steps instead.
    (function () {
      var deferred = null;
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        deferred = e;
      });
      window.addEventListener('appinstalled', function () { deferred = null; });
      // 'installed' when opened from the home screen; 'prompt' when the browser can install it; 'ios' on iPhone
      // and iPad, where it is added from the Share menu; otherwise 'none'.
      window.mintadealInstallKind = function () {
        var standalone = window.navigator.standalone === true ||
            window.matchMedia('(display-mode: standalone)').matches;
        if (standalone) return 'installed';
        if (deferred) return 'prompt';
        var ua = window.navigator.userAgent;
        var iOS = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        return iOS ? 'ios' : 'none';
      };
      window.mintadealInstallPrompt = function () {
        if (!deferred) return Promise.resolve(false);
        var e = deferred;
        deferred = null;
        e.prompt();
        return e.userChoice.then(function (choice) { return choice.outcome === 'accepted'; });
      };
    })();
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
